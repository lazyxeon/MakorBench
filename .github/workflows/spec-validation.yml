name: Spec validation

on:
  push:
    branches:
      - main
      - phase-0-recon
      - phase-1-spec
      - phase-1-scoring
      - phase-2-case-001
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: python -m pip install -r requirements-ci.txt

      - name: Run reference and contract tests
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Run Case 001 public smoke tests
        run: |
          python -m unittest discover \
            -s examples/canonical-001-completion-timeout/fixture/tests \
            -p "test_*.py"

      - name: Run Case 001 private verifier tests
        run: |
          python -m unittest discover \
            -s examples/canonical-001-completion-timeout/private/tests \
            -p "test_*.py"

      - name: Generate and validate Case 001 evidence bundle
        run: |
          python examples/canonical-001-completion-timeout/fixture/generate_evidence.py
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("examples/canonical-001-completion-timeout/fixture/generated")
          metrics = json.loads((root / "metrics.json").read_text())
          traces = json.loads((root / "traces.json").read_text())
          logs = [json.loads(line) for line in (root / "logs.jsonl").read_text().splitlines() if line.strip()]

          assert metrics["job_status"]["incident-8f2a"] == "TIMED_OUT"
          assert metrics["completion_rejected_count"] >= 1
          assert metrics["lease_expired_count"] >= 1
          assert metrics["token_rotated_count"] >= 1

          incident = traces["incident-8f2a"]
          events = {item["event"] for item in incident}
          assert "render_complete" in events
          assert "commit_ok" in events
          assert "ledger_commit_ok" in events
          assert "completion_rejected" in events
          assert "lease_expired" in events

          services = {item["service"] for item in logs}
          assert {"identity", "worker", "artifact", "billing", "completion_gateway", "scheduler"} <= services
          print("Case 001 evidence bundle validated")
          PY

      - name: Build and inspect Case 001 blinded reviewer bundle
        run: |
          python examples/canonical-001-completion-timeout/reviewer/build_bundle.py /tmp/case001-reviewer
          python - <<'PY'
          from pathlib import Path

          root = Path("/tmp/case001-reviewer")
          required = [
              root / "prompt.md",
              root / "REVIEW-INSTRUCTIONS.md",
              root / "review-response.md",
              root / "fixture" / "makor_fixture" / "completion.py",
              root / "fixture" / "tests" / "test_smoke.py",
              root / "evidence" / "logs.jsonl",
              root / "evidence" / "metrics.json",
              root / "evidence" / "traces.json",
          ]
          for path in required:
              assert path.exists(), path

          forbidden = ("private", "oracle", "reference_solution", "counterfactual")
          for path in root.rglob("*"):
              rel = str(path.relative_to(root)).lower()
              assert not any(token in rel for token in forbidden), rel

          print("blinded reviewer bundle validated")
          PY

      - name: Parse JSON schemas
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          files = sorted(Path("schemas").glob("*.json"))
          if not files:
              raise SystemExit("No JSON schemas found")

          expected = "https://json-schema.org/draft/2020-12/schema"
          for path in files:
              data = json.loads(path.read_text())
              if data.get("$schema") != expected:
                  raise SystemExit(f"{path}: unexpected $schema {data.get('$schema')!r}")
              print(f"ok: {path}")
          PY
